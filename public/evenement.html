<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails Tournoi — MEVA Initiative</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/assets/images/meva_initiative_logo_logo.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-meva-bg text-meva-textMain min-h-screen flex flex-col font-sans antialiased selection:bg-meva-accent selection:text-meva-bg">

  <div id="navbar-container"></div>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
    <div class="flex items-center justify-between">
      <a href="./calendrier.html" class="text-xs text-meva-textMuted hover:text-white transition-colors flex items-center gap-1">
        ← Retour au calendrier
      </a>
      <span id="event-badge-status" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-[#232734] text-meva-textMuted border border-meva-border">
        Chargement...
      </span>
    </div>

    <div id="event-detail-card" class="bg-meva-surface border border-meva-border rounded-2xl chamfered-card overflow-hidden shadow-xl">
      <div class="p-12 text-center text-xs text-meva-textMuted">
        Chargement des informations du tournoi...
      </div>
    </div>
  </main>

  <script type="module">
    import { db, auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "/vendor/firebase/firebase-auth.js";
    import { 
      collection, doc, getDoc, getDocs, setDoc, deleteDoc, updateDoc, query, where 
    } from "/vendor/firebase/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    let eventId = params.get("id") || localStorage.getItem("meva_current_event");
    if (eventId) localStorage.setItem("meva_current_event", eventId);

    const cardContainer = document.getElementById("event-detail-card");
    const badgeStatus = document.getElementById("event-badge-status");
    
    let currentEvent = null;
    let currentUser = null;
    let isMember = false;
    let isRegistered = false;
    let myRegisteredSeats = 0;
    let publicPlayersList = [];

    function renderMemberRestricted() {
      if (badgeStatus) {
        badgeStatus.textContent = "Accès restreint";
        badgeStatus.className = "text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-purple-950/60 text-meva-accent border border-meva-accent/40";
      }

      cardContainer.innerHTML = `
        <div class="p-8 sm:p-12 text-center space-y-6">
          <div class="w-16 h-16 mx-auto bg-purple-950/40 border border-meva-accent/40 rounded-2xl flex items-center justify-center text-2xl text-meva-accent shadow-lg shadow-purple-950/50">🔒</div>
          <div class="space-y-2 max-w-md mx-auto">
            <span class="text-[10px] font-bold uppercase tracking-widest text-meva-accent bg-purple-900/40 border border-meva-accent/30 px-2.5 py-1 rounded">Événement MEVA Exclusif</span>
            <h1 class="text-2xl font-black text-white">Tournoi réservé aux adhérents</h1>
            <p class="text-xs sm:text-sm text-meva-textMuted leading-relaxed">Cet événement fait partie de la ligue privée de l'association MEVA Initiative. Pour consulter la fiche complète et t'y inscrire, l'adhésion est requise.</p>
          </div>
          <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3 max-w-md mx-auto">
            <a href="./association.html" class="w-full sm:w-auto flex-1 py-3 px-6 bg-meva-accent hover:bg-meva-accentHover text-meva-bg font-bold text-xs rounded-lg transition-colors shadow-lg shadow-purple-950/40 text-center">Adhérer sur HelloAsso →</a>
            <a href="./calendrier.html" class="w-full sm:w-auto py-3 px-6 bg-meva-bg hover:bg-meva-border border border-meva-border text-white font-semibold text-xs rounded-lg transition-colors text-center">Voir les tournois publics</a>
          </div>
        </div>
      `;
    }

    async function loadPublicPlayersList() {
      publicPlayersList = [];
      if (!currentEvent) return;
      try {
        const q = query(collection(db, "registrations"), where("eventId", "==", currentEvent.id));
        const snap = await getDocs(q);
        
        for (const docSnap of snap.docs) {
          const regData = docSnap.data();
          const userSnap = await getDoc(doc(db, "users", regData.userId));
          if (userSnap.exists()) {
            const userData = userSnap.data();
            const seats = Number(regData.seats) || 1;
            publicPlayersList.push({
              pseudo: userData.pseudo || userData.displayName || "Joueur mystère",
              isMember: userData.roles?.member === true,
              seats: seats,
              guestsCount: seats > 1 ? seats - 1 : 0
            });
          }
        }
      } catch (err) {
        console.error("Erreur récupération joueurs:", err);
      }
    }

    async function loadEvent() {
      if (!eventId || eventId === "undefined") {
        cardContainer.innerHTML = `<div class="p-8 text-center text-xs text-red-400 font-bold">Aucun tournoi sélectionné. Retourne au calendrier.</div>`;
        return;
      }

      try {
        const snap = await getDoc(doc(db, "events", eventId));

        if (!snap || !snap.exists()) {
          cardContainer.innerHTML = `<div class="p-8 text-center text-xs text-meva-textMuted">Tournoi introuvable ou supprimé.</div>`;
          return;
        }

        currentEvent = { id: snap.id, ...snap.data() };
        if (!Array.isArray(currentEvent.participants)) {
          currentEvent.participants = [];
        }

        if (currentEvent.isPrivate && !isMember) {
          renderMemberRestricted();
          return;
        }

        if (badgeStatus) {
          badgeStatus.textContent = currentEvent.isPrivate ? "🔒 Privé MEVA" : "Public";
          badgeStatus.className = currentEvent.isPrivate 
            ? "text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-purple-950/60 text-meva-accent border border-meva-accent/40"
            : "text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-[#232734] text-white border border-meva-border";
        }

        await checkRegistration();
        await loadPublicPlayersList();
        renderDetail();
      } catch (err) {
        console.error("Erreur chargement tournoi :", err);
        if (err.code === "permission-denied") {
          renderMemberRestricted();
        } else {
          cardContainer.innerHTML = `<div class="p-8 text-center text-xs text-red-400">Impossible de charger les données du tournoi.</div>`;
        }
      }
    }

    async function checkRegistration() {
      if (!currentUser || !currentEvent) {
        isRegistered = false;
        myRegisteredSeats = 0;
        return;
      }
      try {
        const myTicketRef = doc(db, "registrations", `${currentEvent.id}_${currentUser.uid}`);
        const myTicketSnap = await getDoc(myTicketRef);
        if (myTicketSnap.exists()) {
          isRegistered = true;
          myRegisteredSeats = myTicketSnap.data().seats || 1;
        } else {
          isRegistered = (currentEvent.participants || []).includes(currentUser.uid);
          myRegisteredSeats = isRegistered ? 1 : 0;
        }
      } catch (e) {
        isRegistered = (currentEvent.participants || []).includes(currentUser.uid);
        myRegisteredSeats = isRegistered ? 1 : 0;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          if (userSnap.exists()) {
            const data = userSnap.data();
            isMember = data.roles?.member === true || data.roles?.admin === true;
          }
        } catch (e) {
          isMember = false;
        }
      } else {
        isMember = false;
      }
      await loadEvent();
    });

    function renderDetail() {
      if (!currentEvent) return;
      if (currentEvent.isPrivate && !isMember) {
        renderMemberRestricted();
        return;
      }

      const totalSeatsFromRegs = publicPlayersList.reduce((sum, p) => sum + (p.seats || 1), 0);
      const count = Math.max(0, totalSeatsFromRegs, (currentEvent.participants || []).length);
      const cap = currentEvent.capacity || 16;
      const pct = Math.min(100, Math.round((count / cap) * 100));
      const isFull = count >= cap;
      const placesRemaining = cap - count;

      let interactionHtml = '';
      if (!currentUser) {
        interactionHtml = `<button id="btn-participate" class="w-full py-3 px-6 bg-meva-surface border border-meva-border hover:border-meva-accent text-white font-bold text-xs rounded-lg transition-colors">Se connecter pour s'inscrire</button>`;
      } else if (isRegistered) {
        let seatText = myRegisteredSeats > 1 ? ` (+${myRegisteredSeats - 1} invité${myRegisteredSeats > 2 ? 's' : ''})` : "";
        interactionHtml = `<button id="btn-participate" class="w-full py-3 px-6 bg-green-950/40 border border-green-800/40 hover:bg-red-950/40 hover:border-red-900/40 hover:text-red-400 text-green-400 font-bold text-xs rounded-lg transition-colors group">
          <span class="group-hover:hidden">✅ Inscription validée${seatText} (Clique pour désinscrire)</span>
          <span class="hidden group-hover:inline">❌ Annuler mon inscription</span>
        </button>`;
      } else if (isFull) {
        interactionHtml = `<button disabled class="w-full py-3 px-6 bg-meva-surface border border-meva-border text-meva-textMuted opacity-50 cursor-not-allowed font-bold text-xs rounded-lg">Tournoi complet</button>`;
      } else {
        let seatsOptions = `<option value="1">1 place (seulement moi)</option>`;
        if (!currentEvent.isPrivate) {
          if (placesRemaining >= 2) seatsOptions += `<option value="2">2 places (moi + 1 invité)</option>`;
          if (placesRemaining >= 3) seatsOptions += `<option value="3">3 places (moi + 2 invités)</option>`;
        }
        
        const selectHtml = currentEvent.isPrivate ? '' : `
          <select id="select-seats" class="w-full mb-3 bg-meva-bg border border-meva-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-meva-accent">
            ${seatsOptions}
          </select>
        `;

        interactionHtml = `
          ${selectHtml}
          <button id="btn-participate" class="w-full py-3 px-6 bg-meva-accent hover:bg-meva-accentHover text-meva-bg font-bold text-xs rounded-lg transition-colors">✋ Valider l'inscription</button>
        `;
      }

      const locationDisplay = currentEvent.address 
        ? `${currentEvent.location} — <span class="text-white/80 font-normal">${currentEvent.address}</span>` 
        : (currentEvent.location || "Lieu non précisé");

      let playersListHtml = '';
      if (publicPlayersList.length > 0) {
        const sortedPlayers = publicPlayersList.sort((a, b) => a.pseudo.localeCompare(b.pseudo));
        const listItems = sortedPlayers.map(p => {
          const guestTag = p.guestsCount > 0 ? `<span class="text-meva-textMuted text-[10px] italic"> (+${p.guestsCount})</span>` : "";
          const memberTag = p.isMember ? `<span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block mr-1"></span>` : "";
          return `<li class="flex items-center text-xs font-semibold text-white bg-meva-bg/50 px-3 py-1.5 rounded border border-meva-border/30">${memberTag}${p.pseudo}${guestTag}</li>`;
        }).join("");
        
        playersListHtml = `
          <div class="pt-6 border-t border-meva-border/60 space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-white flex items-center gap-1.5">
              <span>👥</span> Joueurs inscrits
            </h3>
            <ul class="flex flex-wrap gap-2">
              ${listItems}
            </ul>
          </div>
        `;
      }

      cardContainer.innerHTML = `
        <div class="h-64 sm:h-72 bg-cover bg-center border-b border-meva-border flex items-center justify-center relative" style="background-image: linear-gradient(to bottom, rgba(15,17,23,0.4), rgba(15,17,23,0.9)), url('${currentEvent.imageUrl || ''}')">
          <h1 class="text-2xl sm:text-4xl font-black text-white px-4 text-center">${currentEvent.title}</h1>
        </div>
        <div class="p-6 sm:p-8 space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 py-3 border-y border-meva-border/60 text-xs text-meva-textMuted">
            <p>📅 <strong class="text-white">${currentEvent.date}</strong></p>
            <p>📍 <strong class="text-white">${locationDisplay}</strong></p>
            <p>⚔️ Format : <strong class="text-white">${currentEvent.format || "Premier"}</strong></p>
            <p>🎟️ PAF : <strong class="text-meva-accent">${currentEvent.price || "Gratuit"}</strong></p>
          </div>
          <div class="space-y-2 pt-2">
            <div class="flex justify-between text-xs">
              <span class="text-meva-textMuted">Places réservées</span>
              <span class="font-bold text-white">${count} / ${cap} places</span>
            </div>
            <div class="w-full bg-meva-bg h-2.5 rounded-full overflow-hidden border border-meva-border">
              <div class="bg-meva-accent h-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>

          ${currentEvent.description ? `
            <div class="pt-4 border-t border-meva-border/60 space-y-2 text-left">
              <h3 class="text-xs font-bold uppercase tracking-wider text-white flex items-center gap-1.5">
                <span>📋</span> Détails & Informations
              </h3>
              <p class="text-xs sm:text-sm text-meva-textMuted leading-relaxed whitespace-pre-line bg-meva-bg/60 p-4 rounded-xl border border-meva-border/40">
                ${currentEvent.description}
              </p>
            </div>
          ` : ''}

          <div class="space-y-3 pt-4 border-t border-meva-border/60">
            ${interactionHtml}
            ${currentUser ? `<p class="text-[11px] text-meva-textMuted text-center">Cette action synchronise ta place avec ton Espace Joueur.</p>` : ''}
            
            ${(() => {
              if (!currentEvent.meleeUrl) return '';
              const url = currentEvent.meleeUrl.toLowerCase();
              let btnText = "Accéder au site organisateur";
              let infoText = "Inscription ou détails complémentaires :";

              if (url.includes("melee.gg")) {
                btnText = "S'inscrire sur Melee.gg";
                infoText = "Ce tournoi requiert une inscription officielle :";
              } else if (url.includes("facebook") || url.includes("fb.me")) {
                btnText = "Voir l'événement Facebook";
                infoText = "Retrouve les détails sur Facebook :";
              } else if (url.includes("discord")) {
                btnText = "Rejoindre le Discord organisateur";
                infoText = "Échange avec les joueurs sur Discord :";
              }

              return `
                <div class="pt-3 border-t border-meva-border/40 text-center space-y-2">
                  <p class="text-xs text-meva-textMuted">${infoText}</p>
                  <a href="${currentEvent.meleeUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 w-full py-3 px-6 bg-meva-accent hover:bg-meva-accentHover text-meva-bg font-bold text-xs rounded-lg transition-colors">
                    <span>${btnText}</span>
                    <span>↗</span>
                  </a>
                </div>
              `;
            })()}
          </div>

          ${playersListHtml}
        </div>
      `;

      const btn = document.getElementById("btn-participate");
      if (btn) {
        btn.onclick = async () => {
          if (!currentUser) return window.location.href = "./connexion.html";

          btn.disabled = true;
          btn.textContent = "Mise à jour...";

          try {
            const targetEventId = currentEvent.id;
            const uid = currentUser.uid;
            const regDocRef = doc(db, "registrations", `${targetEventId}_${uid}`);

            let updatedParts = currentEvent.participants || [];

            if (isRegistered) {
              await deleteDoc(regDocRef);
              updatedParts = updatedParts.filter(id => id !== uid);
              
              try {
                await updateDoc(doc(db, "events", targetEventId), {
                  participants: updatedParts,
                  count: updatedParts.length
                });
              } catch (e) {}

              currentEvent.participants = updatedParts;
              isRegistered = false;
              myRegisteredSeats = 0;
            } else {
              const seatSelect = document.getElementById("select-seats");
              const requestedSeats = seatSelect ? parseInt(seatSelect.value, 10) : 1;
              const actualSeats = Math.min(requestedSeats, currentEvent.capacity - count);

              if (actualSeats <= 0) {
                alert("Désolé, il n'y a plus assez de places.");
                btn.disabled = false;
                return;
              }

              await setDoc(regDocRef, {
                eventId: targetEventId,
                userId: uid,
                createdAt: new Date(),
                seats: actualSeats,
                guestsCount: actualSeats - 1
              });

              for (let i = 0; i < actualSeats; i++) {
                updatedParts.push(uid);
              }

              try {
                await updateDoc(doc(db, "events", targetEventId), {
                  participants: updatedParts,
                  count: updatedParts.length
                });
              } catch (e) {}

              currentEvent.participants = updatedParts;
              isRegistered = true;
              myRegisteredSeats = actualSeats;
            }

            await loadPublicPlayersList();
            renderDetail();
          } catch (err) {
            console.error("Erreur inscription:", err);
            alert("Erreur lors de l'enregistrement. Vérifie ta connexion.");
            btn.disabled = false;
          }
        };
      }
    }
  </script>
  <script type="module" src="./navbar.js"></script>
</body>
</html>
